name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  php-lint:
    name: PHP Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        run: |
          find keeweb/appinfo keeweb/lib keeweb/templates keeweb/tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate appinfo/info.xml against Nextcloud schema
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils curl
          curl -fsSL https://apps.nextcloud.com/schema/apps/info.xsd -o /tmp/info.xsd
          xmllint --noout --schema /tmp/info.xsd keeweb/appinfo/info.xml

  js-build-and-test:
    name: Node 20 Build & KDBX 3/4 Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: keeweb/package-lock.json
      - name: Install dependencies
        working-directory: keeweb
        run: npm ci
      - name: Run KDBX 3.1 & KDBX 4.1 Argon2 test suite
        working-directory: keeweb
        run: npm test
      - name: Build production bundles
        working-directory: keeweb
        run: npm run build
      - name: Verify compiled bundles exist
        run: |
          test -s keeweb/js/main.js
          test -s keeweb/js/viewer.js
          test -s keeweb/js/argon2-worker.js

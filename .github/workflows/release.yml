name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package and publish (without v prefix, e.g. 0.7.0)"
        required: true
        type: string
      publish_appstore:
        description: "Publish signed archive to Nextcloud App Store (requires APPSTORE_KEY and NC_AUTH_TOKEN secrets)"
        required: false
        default: false
        type: boolean

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: keeweb/package-lock.json
      - name: Build and test app
        run: ./bin/build
      - name: Package appstore tarball
        working-directory: keeweb
        run: |
          make appstore
          mv build/artifacts/appstore/keeweb.tar.gz "build/artifacts/appstore/keeweb-${{ inputs.version }}.tar.gz"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keeweb-${{ inputs.version }}
          path: keeweb/build/artifacts/appstore/keeweb-${{ inputs.version }}.tar.gz
      - name: Publish to Nextcloud App Store
        if: ${{ inputs.publish_appstore == true }}
        env:
          APPSTORE_KEY: ${{ secrets.APPSTORE_KEY }}
          NC_AUTH_TOKEN: ${{ secrets.NC_AUTH_TOKEN }}
        run: |
          if [ -z "$APPSTORE_KEY" ] || [ -z "$NC_AUTH_TOKEN" ]; then
            echo "APPSTORE_KEY or NC_AUTH_TOKEN secret is not configured; skipping store upload."
            exit 1
          fi
          echo "$APPSTORE_KEY" > "${RUNNER_TEMP}/keeweb.key"
          SIGNING_KEY="${RUNNER_TEMP}/keeweb.key" ./bin/publish "v${{ inputs.version }}" "keeweb/build/artifacts/appstore/keeweb-${{ inputs.version }}.tar.gz"
          rm -f "${RUNNER_TEMP}/keeweb.key"
